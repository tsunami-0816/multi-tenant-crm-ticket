server:
  port: 8081

spring:
  application:
    name: customer
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: ${NACOS_SERVER:nacos:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/multi_tenant_saas?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_SERVER:kafka:9092}
    consumer:
      group-id: customer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  tenant:
    enable: true

jwt:
  secret: ${JWT_SECRET:my-32-byte-secret-key-for-jwt-signing-2026!!}
  expire-hours: 2
