server:
  port: 8082

spring:
  application:
    name: ticket
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: ${NACOS_SERVER:nacos:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/multi_tenant_saas?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
  kafka:
    bootstrap-servers: ${KAFKA_SERVER:kafka:9092}
    producer:
      acks: all
      retries: 3

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
